# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit 설정 파일

# ─────────────────────────────────────────
# 🌐 언어 설정
# ─────────────────────────────────────────
language: "ko-KR"

# ─────────────────────────────────────────
# 🔍 코드래빗 리뷰 기본 설정
# ─────────────────────────────────────────
reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: false
  poem: false
  review_status: true
  collapse_walkthrough: false
  sequence_diagrams: false
  changed_files_summary: true

  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    base_branches:
      - "dev" # dev 브랜치로 들어오는 PR 리뷰

  # ── 리뷰에서 제외할 파일/폴더 패턴 (Expo/React Native 기준으로 조정) ──
  path_filters:
    - "!**/node_modules/**"
    - "!**/.expo/**" # Expo 로컬 캐시 제외
    - "!**/.expo-shared/**"
    - "!android/**" # 네이티브 빌드 폴더 제외
    - "!ios/**"
    - "!**/dist/**"
    - "!**/build/**"
    - "!**/coverage/**"
    - "!**/__snapshots__/**"
    - "!**/*.lock"
    - "!**/pnpm-lock.yaml"
    - "!**/*.min.js"
    - "!**/*.min.css"
    - "!**/assets/**" # 이미지/폰트 등 정적 리소스 제외

  # ── 폴더별 컨벤션 지침 ──
  path_instructions:
    - path: "app/**"
      instructions: |
        Expo Router 라우트 파일을 리뷰할 때 다음을 확인해주세요:
        - Expo Router 예약 파일을 제외한 파일명은 kebab-case로 작성 (ex. user-profile.tsx)
        - 동적 segment는 대괄호 표기 사용 (ex. [taskId].tsx)
        - route 파일은 default export를 제공
        - route param/search param 처리, 접근 제어, navigation option, Screen 연결만 담당
        - View/Text 기반의 큰 화면 UI나 Zustand 비즈니스 상태를 route에 직접 작성하지 않음
        - 실제 화면은 features/<feature>/components/*Screen.tsx에 배치
        - 과제 route는 /tasks/personal/[taskId], /tasks/team/[taskId], /tasks/[taskId]/edit 구조를 따르는지 확인

    - path: "features/**"
      instructions: |
        기능 단위 코드를 리뷰할 때 다음을 확인해주세요:
        - route와 연결되는 화면은 components/*Screen.tsx에 배치하고 named function export 사용
        - 별도 screens 폴더를 만들지 않음
        - 현재 feature 바로 아래에는 components와 hooks만 두며, 다른 하위 폴더는 팀 합의 후 추가
        - 기능 전용 UI와 hook은 해당 feature 내부에 유지
        - 개인/팀 과제 상세는 분리하고 공통 UI는 features/tasks/components에서 재사용
        - features에서 app을 import하지 않음
        - 다른 feature를 직접 import할 때는 공통 책임으로 승격할 코드인지 검토

    - path: "components/**"
      instructions: |
        React Native 컴포넌트를 리뷰할 때 다음을 확인해주세요:
        - components/icons를 제외한 컴포넌트 파일명은 PascalCase이며 컴포넌트명과 일치 (ex. UserCard.tsx)
        - 컴포넌트는 export function Name() {} 형태로 작성 (화살표 함수 + export default 지양)
        - props 타입은 파일 상단에 type XxxProps = {} 형태로 선언
        - View / Text / Pressable 등 react-native 기본 요소 사용 확인 (div, span 같은 웹 태그 사용 금지)
        - 불필요한 리렌더링을 유발하는 코드가 없는지
        - components/common은 여러 feature가 공유하는 도메인 비종속 표현 UI만 포함
        - components/common에서 app, features, store, Expo Router를 import하지 않음
        - 공용 아이콘은 components/icons에 두고 아이콘 파일명은 kebab-case 사용

    - path: "providers/**"
      instructions: |
        앱 전역 Provider와 UI Host를 리뷰할 때 다음을 확인해주세요:
        - 앱 최상단에 한 번 마운트되는 Provider 조합과 전역 UI Host만 포함
        - 기능별 화면 UI나 비즈니스 로직을 포함하지 않음
        - 프로젝트 내부에서는 store, components/common, lib에만 의존하고 app이나 features를 import하지 않음

    - path: "hooks/**"
      instructions: |
        커스텀 훅을 리뷰할 때 다음을 확인해주세요:
        - 훅 이름과 파일명은 use로 시작하는 camelCase (ex. useDebounce.ts, useAuthStore.ts)
        - 훅 구현은 named function export를 사용하며 플랫폼별 모듈의 재-export는 허용
        - 의존성 배열(dependency array)이 올바르게 설정되어 있는지
        - 여러 feature가 공유하는 도메인 비종속 hook만 포함
        - 특정 기능 전용 hook은 features/<feature>/hooks에 배치

    - path: "lib/**"
      instructions: |
        여러 기능이 공유하는 기반 및 범용 코드를 리뷰할 때 다음을 확인해주세요:
        - React 화면이나 특정 feature의 비즈니스 로직을 포함하지 않음
        - 두 개 이상의 기능에서 재사용할 수 있는 범용 책임인지 확인
        - app이나 features에 역방향으로 의존하지 않음

    - path: "store/**"
      instructions: |
        Zustand 스토어를 리뷰할 때 다음을 확인해주세요:
        - export const useXxxStore = create(...) 형태로 작성
        - 상태(state)와 액션(action)이 명확히 구분되어 있는지
        - 앱 전역에서 공유하는 클라이언트/UI 상태만 포함
        - 특정 feature 내부에서만 필요한 상태를 전역 store로 올리지 않음

    - path: "types/**"
      instructions: |
        타입 정의 코드를 리뷰할 때 다음을 확인해주세요:
        - 파일명은 camelCase + .types.ts (ex. user.types.ts)
        - 두 개 이상의 feature가 공유하는 타입만 포함
        - any 타입 사용 지양

    - path: "constants/**"
      instructions: |
        상수 파일을 리뷰할 때 다음을 확인해주세요:
        - 파일명은 camelCase (ex. colors.ts)
        - 상수 값은 UPPER_SNAKE_CASE로 작성 (ex. MAX_RETRY_COUNT)
        - 여러 feature가 공유하는 전역 상수와 디자인 값만 포함

  # ── 전체 공통 리뷰 지침 ──
  instructions: |
    다음 팀 컨벤션을 기준으로 리뷰해주세요:
    - 커밋 메시지는 "태그: 작업내용" 형식을 따릅니다 (ex. feat: 로그인 화면 구현)
    - 커밋 타입: feat, fix, ui, design, docs, refactor, test, chore, setting, build, asset, comment, rename, remove, hotfix, release
    - TypeScript에서 any 타입 사용은 지양합니다
    - 절대경로 import(@/) 사용을 권장합니다
    - 코드 스타일(포매팅)은 Prettier가 담당하므로 리뷰하지 않아도 됩니다
    - src와 별도 screens 폴더를 제안하지 않습니다
    - 의존성 방향은 app -> features -> components/common + lib를 따릅니다
    - providers는 store, components/common, lib에만 의존합니다
    - features는 app을 import하지 않고 components/common은 app, features, store, Expo Router를 import하지 않습니다
    - feature 간 직접 import와 순환 참조가 없는지 확인합니다

# ─────────────────────────────────────────
# 💬 채팅(코멘트 답변) 설정
# ─────────────────────────────────────────
chat:
  auto_reply: false

# ─────────────────────────────────────────
# 🧠 지식베이스 설정
# ─────────────────────────────────────────
knowledge_base:
  opt_out: false
  web_search:
    enabled: true
  learnings:
    scope: local
